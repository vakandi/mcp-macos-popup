<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --info: #0a84ff;
    --success: #30d158;
    --warning: #ff9f0a;
    --error: #ff453a;
    --text: rgba(255, 255, 255, 0.92);
    --text-dim: rgba(255, 255, 255, 0.55);
    --border: rgba(255, 255, 255, 0.10);
  }

  html, body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    cursor: default;
  }

  .card {
    position: relative;
    margin: 6px;
    background: rgba(24, 26, 32, 0.78);
    backdrop-filter: blur(28px) saturate(1.4);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    opacity: 0;
    transform: translateX(40px);
    animation: slide-in 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .card.fading { transition: opacity 0.25s ease, transform 0.25s ease; opacity: 0; transform: translateX(30px); }
  @keyframes slide-in { to { opacity: 1; transform: translateX(0); } }

  .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .level-info    .accent { background: linear-gradient(180deg, var(--info), transparent); }
  .level-success .accent { background: linear-gradient(180deg, var(--success), transparent); }
  .level-warning .accent { background: linear-gradient(180deg, var(--warning), transparent); }
  .level-error   .accent { background: linear-gradient(180deg, var(--error), transparent); }

  .inner { padding: 14px 16px 12px 18px; }

  /* ── Header ── */
  .header { display: flex; align-items: center; gap: 10px; -webkit-app-region: drag; }
  .badge {
    flex: none; width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #fff;
  }
  .level-info    .badge { background: var(--info); }
  .level-success .badge { background: var(--success); }
  .level-warning .badge { background: var(--warning); }
  .level-error   .badge { background: var(--error); }

  .title {
    font-size: 13px; font-weight: 600; letter-spacing: 0.1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  }
  .source-chip {
    flex: none; font-size: 9.5px; font-weight: 700; letter-spacing: 0.8px;
    text-transform: uppercase; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 20px; padding: 2px 8px;
  }
  .close-btn {
    flex: none; -webkit-app-region: no-drag;
    width: 20px; height: 20px; border-radius: 50%;
    border: none; background: rgba(255,255,255,0.08); color: var(--text-dim);
    font-size: 11px; line-height: 1; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .close-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }

  /* ── Body ── */
  .body { margin-top: 10px; font-size: 13px; line-height: 1.5; color: var(--text); user-select: text; cursor: auto; overflow-wrap: break-word; }
  .notify-msg { white-space: pre-wrap; }

  /* Markdown (docs mode) */
  .md h1, .md h2, .md h3 { font-weight: 650; line-height: 1.3; margin: 12px 0 5px; }
  .md h1:first-child, .md h2:first-child, .md h3:first-child { margin-top: 0; }
  .md h1 { font-size: 16px; }
  .md h2 { font-size: 14.5px; }
  .md h3 { font-size: 13.5px; }
  .md p { margin: 5px 0; }
  .md ul, .md ol { margin: 5px 0; padding-left: 20px; }
  .md li { margin: 2.5px 0; }
  .md code {
    font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11.5px;
    background: rgba(255,255,255,0.09); border-radius: 4px; padding: 1.5px 5px;
  }
  .md pre {
    background: rgba(0,0,0,0.42); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; margin: 7px 0; overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; font-size: 11px; line-height: 1.55; }
  .md blockquote { border-left: 2.5px solid var(--text-dim); padding-left: 10px; margin: 6px 0; color: var(--text-dim); }
  .md a { color: var(--info); text-decoration: none; }
  .md a:hover { text-decoration: underline; }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 9px 0; }
  .md strong { font-weight: 650; }

  /* ── Progress bar ── */
  .progress { position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; background: rgba(255,255,255,0.06); }
  .progress-fill { height: 100%; width: 100%; border-radius: 0 2px 2px 0; }
  .level-info    .progress-fill { background: var(--info); }
  .level-success .progress-fill { background: var(--success); }
  .level-warning .progress-fill { background: var(--warning); }
  .level-error   .progress-fill { background: var(--error); }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="accent"></div>
    <div class="inner">
      <div class="header">
        <div class="badge" id="badge">i</div>
        <div class="title" id="title"></div>
        <div class="source-chip" id="chip" style="display:none"></div>
        <button class="close-btn" id="close" title="Dismiss">&#10005;</button>
      </div>
      <div class="body" id="body"></div>
    </div>
    <div class="progress"><div class="progress-fill" id="fill"></div></div>
  </div>

<script>
  const BADGES = { info: "i", success: "\u2713", warning: "!", error: "\u2715" };

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Minimal markdown -> HTML (headings, lists, code blocks, quotes, bold/italic/code, links, hr).
  function renderMarkdown(src) {
    const lines = escapeHtml(src).split("\n");
    let html = "", inCode = false, listStack = [];

    const inline = (t) => t
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

    const closeLists = () => { while (listStack.length) html += listStack.pop() === "ul" ? "</ul>" : "</ol>"; };

    for (const raw of lines) {
      const line = raw.trimEnd();
      if (line.startsWith("```")) {
        closeLists();
        if (inCode) { html += "</code></pre>"; inCode = false; }
        else { html += "<pre><code>"; inCode = true; }
        continue;
      }
      if (inCode) { html += line + "\n"; continue; }

      const m = line.match(/^(#{1,3})\s+(.*)$/) || line.match(/^(-{3,}|\*{3,})$/);
      if (m && m[1] && m[1].startsWith("#")) {
        closeLists();
        const lvl = m[1].length;
        html += `<h${lvl}>${inline(m[2])}</h${lvl}>`;
        continue;
      }
      if (/^(-{3,}|\*{3,})$/.test(line)) { closeLists(); html += "<hr>"; continue; }

      const ul = line.match(/^\s*[-*+]\s+(.*)$/);
      const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        const want = ul ? "ul" : "ol";
        if (listStack[listStack.length - 1] !== want) {
          closeLists();
          html += want === "ul" ? "<ul>" : "<ol>";
          listStack.push(want);
        }
        html += `<li>${inline((ul || ol)[1])}</li>`;
        continue;
      }

      const q = line.match(/^&gt;\s?(.*)$/);
      if (q) { closeLists(); html += `<blockquote>${inline(q[1])}</blockquote>`; continue; }

      if (line.trim() === "") { closeLists(); continue; }
      closeLists();
      html += `<p>${inline(line)}</p>`;
    }
    if (inCode) html += "</code></pre>";
    closeLists();
    return html;
  }

  window.popup.onData((data) => {
    const card = document.getElementById("card");
    card.classList.add("level-" + data.level);

    document.getElementById("badge").textContent = BADGES[data.level] || BADGES.info;
    document.getElementById("title").textContent = data.title || "";
    document.getElementById("title").title = data.title || "";

    if (data.source) {
      const chip = document.getElementById("chip");
      chip.textContent = data.source;
      chip.style.display = "";
    }

    const body = document.getElementById("body");
    if (data.mode === "docs") {
      body.classList.add("md");
      body.innerHTML = renderMarkdown(data.markdown || "");
    } else {
      body.innerHTML = '<div class="notify-msg"></div>';
      body.firstChild.textContent = data.message || "";
    }

    // Countdown bar.
    const fill = document.getElementById("fill");
    fill.style.animation = `shrink ${data.duration}s linear forwards`;
    const style = document.createElement("style");
    style.textContent = "@keyframes shrink { from { width: 100%; } to { width: 0%; } }";
    document.head.appendChild(style);

    // Dismiss handlers.
    document.getElementById("close").addEventListener("click", () => window.popup.sendHeight(-1));
    if (data.mode === "notify") {
      card.addEventListener("click", (e) => {
        if (!e.target.closest("a")) window.popup.sendHeight(-1);
      });
    }

    // Measure real content height and report it.
    requestAnimationFrame(() => {
      window.popup.sendHeight(document.querySelector(".card").getBoundingClientRect().height + 12);
    });
  });

  window.popup.onFadeOut(() => document.getElementById("card").classList.add("fading"));
</script>
</body>
</html>
